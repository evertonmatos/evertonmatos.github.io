<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Berimbau Hero - Ritmos de Capoeira</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080d09;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #fff;
            position: fixed;
        }

        /* Colors per Lane */
        :root {
            --color-tchi: #22c55e;     /* Lane 0: "X" Semipresa / Verde */
            --color-caxixi: #ef4444;   /* Lane 1: Caxixi Chocalho / Vermelho */
            --color-dim: #eab308;      /* Lane 2: "I" Presa / Amarelo */
            --color-dom: #3b82f6;      /* Lane 3: "O" Solta / Azul */
        }

        .lane-0 { --lane-color: var(--color-tchi); }
        .lane-1 { --lane-color: var(--color-caxixi); }
        .lane-2 { --lane-color: var(--color-dim); }
        .lane-3 { --lane-color: var(--color-dom); }

        @keyframes hitPulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hit-active {
            animation: hitPulse 0.12s ease-out;
            box-shadow: 0 0 25px var(--lane-color) !important;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -45px) scale(1.3); }
        }

        .judgment-popup {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            font-weight: 900;
            text-shadow: 0 0 12px rgba(0,0,0,0.9);
        }

        .glass-panel {
            background: rgba(12, 24, 15, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(234, 179, 8, 0.35);
        }

        .capoeira-title {
            text-shadow: 0 0 15px rgba(234, 179, 8, 0.8), 0 0 30px rgba(34, 197, 94, 0.5);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(234, 179, 8, 0.5);
            border-radius: 8px;
        }
        /* Botão Fullscreen */
        #btn-fullscreen {
          position: fixed;
          top: 90px;
          right: 15px;
          z-index: 999;
          background: rgba(0, 0, 0, 0.3);
          border: 1px solid rgba(234, 179, 8, 0.35);
          border-radius: 50%;
          width: 44px;
          height: 44px;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: background 0.2s ease;
        }
        #btn-fullscreen:hover {
          background: rgba(0, 0, 0, 0.5);
        }
        #btn-fullscreen svg {
          width: 22px;
          height: 22px;
          fill: #eab308;
        }
    </style>
</head>
<body class="flex flex-col h-full w-full select-none">

    <div id="app" class="relative w-full h-full flex flex-col justify-between overflow-hidden">

        <!-- Botão de Fullscreen -->
        <button id="btn-fullscreen" title="Alternar Tela Cheia">
            <svg viewBox="0 0 24 24">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
        </button>
        
        <!-- HUD Superior -->
        <header id="hud" class="z-20 p-3 pt-4 flex justify-between items-center glass-panel rounded-b-2xl mx-2 mt-1 shadow-lg">
            <div class="flex items-center gap-3">
                <button id="pauseBtn" class="bg-emerald-950/80 hover:bg-emerald-900 text-yellow-300 w-10 h-10 rounded-full flex items-center justify-center border border-yellow-500/40 transition active:scale-95">
                    <i class="fas font-bold fa-pause"></i>
                </button>
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-yellow-400/80 font-bold">Pontuação</div>
                    <div id="scoreText" class="text-xl font-black tracking-wider text-yellow-300">0</div>
                </div>
            </div>

            <!-- Axé / Multiplicador -->
            <div class="flex flex-col items-center w-1/3 max-w-[160px]">
                <div class="text-[10px] uppercase tracking-widest text-emerald-200/80 mb-1 font-semibold flex justify-between w-full">
                    <span>Axé da Roda</span>
                    <span id="multiplierText" class="text-yellow-400 font-extrabold">1x</span>
                </div>
                <div class="w-full bg-stone-950 h-3.5 rounded-full p-0.5 border border-yellow-600/50 overflow-hidden relative">
                    <div id="healthBar" class="h-full bg-gradient-to-r from-red-600 via-yellow-400 to-emerald-500 rounded-full w-4/5 transition-all duration-200"></div>
                </div>
            </div>

            <!-- Combo -->
            <div class="text-right">
                <div class="text-[10px] uppercase tracking-wider text-yellow-400/80 font-bold">Combo</div>
                <div id="streakText" class="text-xl font-black text-yellow-400">0</div>
            </div>
        </header>

        <!-- CANVAS DO JOGO (PISTA EM PERSPECTIVA) -->
        <div class="relative flex-1 w-full flex items-center justify-center overflow-hidden">
            <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>
            <div id="judgmentContainer" class="absolute inset-0 z-10 pointer-events-none"></div>
        </div>

<!-- BOTÕES DE TOQUE TOUCH (X, CAXIXI, I, 0) -->
        <footer id="touchControls" class="z-20 w-full px-2 pb-4 pt-1 flex items-stretch gap-2">
            <!-- Lane 0: "X" Semipresa -->
            <button id="btn-lane-0" data-lane="0" class="lane-btn lane-0 flex-1 h-20 rounded-2xl bg-gradient-to-b from-emerald-600 to-emerald-800 border-2 border-emerald-400 active:bg-emerald-500 flex flex-col items-center justify-center shadow-lg transition transform active:scale-95 touch-none">
                <span class="text-base font-black text-emerald-100 uppercase tracking-wider">X (Semipresa)</span>
                <span class="text-[10px] text-emerald-200 font-bold mt-0.5">TCHI [A]</span>
            </button>

            <!-- Lane 1: CAXIXI -->
            <button id="btn-lane-1" data-lane="1" class="lane-btn lane-1 flex-1 h-20 rounded-2xl bg-gradient-to-b from-red-600 to-red-800 border-2 border-red-400 active:bg-red-500 flex flex-col items-center justify-center shadow-lg transition transform active:scale-95 touch-none">
                <span class="text-base font-black text-red-100 uppercase tracking-wider">CAXIXI</span>
                <span class="text-[10px] text-red-200 font-bold mt-0.5">Chocalho [S]</span>
            </button>

            <!-- Lane 2: "I" Presa -->
            <button id="btn-lane-2" data-lane="2" class="lane-btn lane-2 flex-1 h-20 rounded-2xl bg-gradient-to-b from-yellow-500 to-amber-700 border-2 border-yellow-300 active:bg-yellow-400 flex flex-col items-center justify-center shadow-lg transition transform active:scale-95 touch-none">
                <span class="text-base font-black text-yellow-100 uppercase tracking-wider">I (Presa)</span>
                <span class="text-[10px] text-yellow-200 font-bold mt-0.5">DIM [D]</span>
            </button>

            <!-- Lane 3: "O" Solta -->
            <button id="btn-lane-3" data-lane="3" class="lane-btn lane-3 flex-1 h-20 rounded-2xl bg-gradient-to-b from-blue-600 to-blue-800 border-2 border-blue-400 active:bg-blue-500 flex flex-col items-center justify-center shadow-lg transition transform active:scale-95 touch-none">
                <span class="text-base font-black text-blue-100 uppercase tracking-wider">O (Solta)</span>
                <span class="text-[10px] text-blue-200 font-bold mt-0.5">DOM [F]</span>
            </button>
        </footer>

        <!-- MENU PRINCIPAL -->
        <div id="mainMenu" class="absolute inset-0 z-50 flex flex-col items-center justify-between p-5 bg-stone-950/95 backdrop-blur-md">
            <div class="mt-4 text-center">
                <div class="inline-block px-3 py-1 bg-yellow-900/60 text-yellow-300 rounded-full text-xs font-bold tracking-widest uppercase mb-2 border border-yellow-500/30">
                    <i class="fas fa-drum mr-1.5"></i> GRILHÕES DA LIBERDADE
                </div>
                <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-yellow-300 to-yellow-500 capoeira-title italic">
                    BERIMBAU HERO
                </h1>
                <p class="text-emerald-200/80 text-xs sm:text-sm mt-1">CORDEL VERDE</p>
            </div>

            <div class="w-full max-w-md space-y-2.5 my-auto">
                <label class="block text-xs font-bold uppercase tracking-wider text-yellow-400">Escolha o Toque da Roda</label>
                <div id="songList" class="space-y-2 max-h-[42vh] overflow-y-auto pr-1"></div>

                <div class="mt-3">
                    <label class="block text-xs font-bold uppercase tracking-wider text-yellow-400 mb-1.5">Andamento / Vel. das Notas</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button data-diff="easy" class="diff-btn py-2.5 rounded-xl border border-stone-700 bg-stone-900 text-stone-300 font-bold text-xs hover:border-emerald-500 transition">Cadenciado</button>
                        <button data-diff="medium" class="diff-btn py-2.5 rounded-xl border border-yellow-500 bg-yellow-950/80 text-yellow-300 font-bold text-xs shadow-md shadow-yellow-900/40">Normal</button>
                        <button data-diff="hard" class="diff-btn py-2.5 rounded-xl border border-stone-700 bg-stone-900 text-stone-300 font-bold text-xs hover:border-red-500 transition">Acelerado</button>
                    </div>
                </div>
            </div>

            <div class="w-full max-w-md mb-2">
                <button id="startPlayBtn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-600 via-yellow-500 to-amber-600 text-stone-950 font-black text-lg tracking-wider uppercase shadow-xl hover:opacity-95 active:scale-98 transition transform flex items-center justify-center gap-3 border border-yellow-400/50">
                    <i class="fas fa-play"></i> Iniciar Roda
                </button>
                <p class="text-[10px] text-center text-stone-400 mt-2">Mobile: Toque nos botões inferiores | PC: [A] [S] [D] [F]</p>
            </div>
        </div>

        <!-- PAUSE MENU -->
        <div id="pauseMenu" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-stone-950/85 backdrop-blur-md">
            <div class="glass-panel p-6 rounded-3xl w-full max-w-sm text-center border border-yellow-600/40 shadow-2xl">
                <h2 class="text-2xl font-black text-yellow-300 mb-6 tracking-wide">RODA PAUSADA</h2>
                <div class="space-y-3">
                    <button id="resumeBtn" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-base shadow-lg active:scale-95 transition">
                        Continuar
                    </button>
                    <button id="restartBtn" class="w-full py-3.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-stone-200 font-bold text-base border border-stone-600 active:scale-95 transition">
                        Reiniciar
                    </button>
                    <button id="quitBtn" class="w-full py-3.5 rounded-xl bg-red-950/60 hover:bg-red-900/80 text-red-300 font-bold text-base border border-red-800/50 active:scale-95 transition">
                        Menu Inicial
                    </button>
                </div>
            </div>
        </div>

        <!-- RESULTS OVERLAY -->
        <div id="resultsMenu" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center p-6 bg-stone-950/95 backdrop-blur-lg">
            <div class="glass-panel p-6 rounded-3xl w-full max-w-md text-center border border-yellow-500/40 shadow-2xl">
                <div id="resultStatusHeader" class="text-3xl font-black mb-1 uppercase tracking-wider text-yellow-400">
                    AXÉ NA RODA!
                </div>
                <p id="resultSongTitle" class="text-emerald-200/80 text-xs mb-5 font-semibold">Toque de Capoeira</p>

                <div class="grid grid-cols-2 gap-3 mb-5">
                    <div class="bg-stone-900/90 p-3 rounded-2xl border border-stone-800">
                        <div class="text-[10px] text-stone-400 font-bold uppercase">Pontuação</div>
                        <div id="resScore" class="text-2xl font-black text-yellow-300 mt-0.5">0</div>
                    </div>
                    <div class="bg-stone-900/90 p-3 rounded-2xl border border-stone-800">
                        <div class="text-[10px] text-stone-400 font-bold uppercase">Maior Combo</div>
                        <div id="resStreak" class="text-2xl font-black text-emerald-400 mt-0.5">0</div>
                    </div>
                    <div class="bg-stone-900/90 p-3 rounded-2xl border border-stone-800">
                        <div class="text-[10px] text-stone-400 font-bold uppercase">Precisão</div>
                        <div id="resAccuracy" class="text-2xl font-black text-yellow-400 mt-0.5">0%</div>
                    </div>
                    <div class="bg-stone-900/90 p-3 rounded-2xl border border-stone-800">
                        <div class="text-[10px] text-stone-400 font-bold uppercase">Toques Perfeitos</div>
                        <div id="resPerfects" class="text-2xl font-black text-yellow-400 mt-0.5">0</div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="resRestartBtn" class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-yellow-500 text-stone-950 font-black text-sm uppercase shadow-lg active:scale-95 transition">
                        Tocar De Novo
                    </button>
                    <button id="resMenuBtn" class="flex-1 py-3.5 rounded-xl bg-stone-800 text-stone-200 font-bold text-sm border border-stone-700 active:scale-95 transition">
                        Menu
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Gerenciamento do Modo Tela Cheia (Fullscreen)
        document.getElementById("btn-fullscreen").addEventListener("click", (e) => {
          e.stopPropagation();
          if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        });

            init() {
                if (!this.ctx) {

            async loadAudioBuffers() {
                if (!this.ctx) return;

                try {
                    this.audioBuffers = await Promise.all(
                        this.audioBase64.map(async (base64) => {
                            const binary = atob(base64);
                            const bytes = new Uint8Array(binary.length);

                            for (let i = 0; i < binary.length; i++) {
                                bytes[i] = binary.charCodeAt(i);
                            }

                            // decodeAudioData decodifica o arquivo original sem alterar
                            // sua duração. O playbackRate permanece em 1.0.
                            return await this.ctx.decodeAudioData(bytes.buffer);
                        })
                    );
                } catch (e) {
                    console.error("Erro ao carregar os áudios originais:", e);
                    this.audioBuffers = [null, null, null, null];
                }
            }

            /*
             * Reproduz o áudio original correspondente à lane.
             *
             * Cada chamada cria um novo AudioBufferSourceNode. Portanto:
             * - a duração é exatamente a do arquivo fornecido;
             * - playbackRate não é alterado (fica em 1.0);
             * - um som novo NÃO interrompe o anterior;
             * - várias notas podem soar simultaneamente.
             */
            playTone(lane) {
                if (!this.ctx || !this.audioBuffers[lane]) return;

                try {
                    const source = this.ctx.createBufferSource();
                    source.buffer = this.audioBuffers[lane];
                    source.playbackRate.setValueAtTime(1.0, this.ctx.currentTime);
                    source.connect(this.masterGain);

                    // Sem stop(): o buffer toca até o fim natural do arquivo.
                    source.start(0);
                } catch (e) {
                    console.error("Erro na reprodução do áudio:", e);
                }
            }

            playMissSound() {
                if (!this.ctx) return;

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(80, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(35, this.ctx.currentTime + 0.15);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            }
        }

        const CAPOEIRA_TOQUES = Object.values(SONGS);

        class CapoeiraGame {
            constructor() {
                this.synth = new BerimbauSynth();
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');

                this.selectedSong = CAPOEIRA_TOQUES[0];
                this.selectedDiff = 'medium';
                this.isPlaying = false;
                this.isPaused = false;

                this.score = 0;
                this.streak = 0;
                this.maxStreak = 0;
                this.health = 80;
                this.totalNotes = 0;
                this.hitNotes = 0;
                this.perfectCount = 0;

                this.notes = [];
                this.songNotesSequence = [];
                this.spawnTimer = 0;
                this.nextNoteIndex = 0;

                this.diffSettings = {
                    easy: { speed: 0.70, windowPerfect: 40, windowGood: 90, speedMult: 0.85 },
                    medium: { speed: 0.95, windowPerfect: 32, windowGood: 72, speedMult: 1.0 },
                    hard: { speed: 1.25, windowPerfect: 24, windowGood: 58, speedMult: 1.2 }
                };

                this.lastTime = 0;
                this.lanePressState = [false, false, false, false];

                this.initUI();
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
            }

            resizeCanvas() {
                this.canvas.width = this.canvas.parentElement.clientWidth;
                this.canvas.height = this.canvas.parentElement.clientHeight;
            }

            initUI() {
                const songListEl = document.getElementById('songList');
                songListEl.innerHTML = CAPOEIRA_TOQUES.map((song, idx) => `
                    <div data-idx="${idx}" class="song-card cursor-pointer p-3 rounded-2xl border ${idx === 0 ? 'border-yellow-500 bg-yellow-950/40' : 'border-stone-800 bg-stone-900/60'} hover:border-yellow-400 transition flex items-center justify-between">
                        <div>
                            <div class="font-black text-yellow-200 text-sm sm:text-base">${song.title}</div>
                            <div class="text-[11px] text-stone-400 mt-0.5">${song.desc}</div>
                        </div>
                        <i class="fas ${idx === 0 ? 'fa-check-circle text-yellow-400' : 'fa-circle text-stone-700'} text-lg check-icon ml-2"></i>
                    </div>
                `).join('');

                document.querySelectorAll('.song-card').forEach(card => {
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.song-card').forEach(c => {
                            c.classList.remove('border-yellow-500', 'bg-yellow-950/40');
                            c.classList.add('border-stone-800', 'bg-stone-900/60');
                            c.querySelector('.check-icon').className = 'fas fa-circle text-stone-700 text-lg check-icon ml-2';
                        });
                        card.classList.remove('border-stone-800', 'bg-stone-900/60');
                        card.classList.add('border-yellow-500', 'bg-yellow-950/40');
                        card.querySelector('.check-icon').className = 'fas fa-check-circle text-yellow-400 text-lg check-icon ml-2';

                        const idx = parseInt(card.getAttribute('data-idx'));
                        this.selectedSong = CAPOEIRA_TOQUES[idx];
                    });
                });

                document.querySelectorAll('.diff-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.diff-btn').forEach(b => {
                            b.className = 'diff-btn py-2.5 rounded-xl border border-stone-700 bg-stone-900 text-stone-300 font-bold text-xs hover:border-yellow-500 transition';
                        });
                        btn.className = 'diff-btn py-2.5 rounded-xl border border-yellow-500 bg-yellow-950/80 text-yellow-300 font-bold text-xs shadow-md shadow-yellow-900/40';
                        this.selectedDiff = btn.getAttribute('data-diff');
                    });
                });

                document.getElementById('startPlayBtn').addEventListener('click', () => this.startGame());
                document.getElementById('pauseBtn').addEventListener('click', () => this.pauseGame());
                document.getElementById('resumeBtn').addEventListener('click', () => this.resumeGame());
                document.getElementById('restartBtn').addEventListener('click', () => this.startGame());
                document.getElementById('quitBtn').addEventListener('click', () => this.showMenu());
                document.getElementById('resRestartBtn').addEventListener('click', () => this.startGame());
                document.getElementById('resMenuBtn').addEventListener('click', () => this.showMenu());

                // Touch control handlers
                const touchBtns = document.querySelectorAll('.lane-btn');
                touchBtns.forEach(btn => {
                    const lane = parseInt(btn.getAttribute('data-lane'));

                    const handlePress = (e) => {
                        e.preventDefault();
                        this.synth.init();
                        this.triggerLane(lane);
                    };

                    const handleRelease = (e) => {
                        e.preventDefault();
                        this.lanePressState[lane] = false;
                        btn.classList.remove('hit-active');
                    };

                    btn.addEventListener('touchstart', handlePress, { passive: false });
                    btn.addEventListener('touchend', handleRelease, { passive: false });
                    btn.addEventListener('mousedown', handlePress);
                    btn.addEventListener('mouseup', handleRelease);
                    btn.addEventListener('mouseleave', handleRelease);
                });

                // Keyboard Controls (A, S, D, F)
                const keyMap = {
                    'a': 0, 'A': 0,
                    's': 1, 'S': 1,
                    'd': 2, 'D': 2,
                    'f': 3, 'F': 3
                };

                window.addEventListener('keydown', (e) => {
                    if (e.repeat || !this.isPlaying || this.isPaused) return;
                    if (keyMap[e.key] !== undefined) {
                        const lane = keyMap[e.key];
                        this.triggerLane(lane);
                        const btn = document.getElementById(`btn-lane-${lane}`);
                        if (btn) btn.classList.add('hit-active');
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (keyMap[e.key] !== undefined) {
                        const lane = keyMap[e.key];
                        this.lanePressState[lane] = false;
                        const btn = document.getElementById(`btn-lane-${lane}`);
                        if (btn) btn.classList.remove('hit-active');
                    }
                });
            }

            async startGame() {
                await this.synth.init();

                this.score = 0;
                this.streak = 0;
                this.maxStreak = 0;
                this.health = 80;
                this.totalNotes = 0;
                this.hitNotes = 0;
                this.perfectCount = 0;
                this.notes = [];
                this.spawnTimer = 0;
                this.nextNoteIndex = 0;
                this.isPlaying = true;
                this.isPaused = false;

                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('pauseMenu').classList.add('hidden');
                document.getElementById('resultsMenu').classList.add('hidden');

                this.generateSongSequence();
                this.updateHUD();

                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            generateSongSequence() {
                const song = this.selectedSong;
                this.songNotesSequence = [];

                // Os tempos `t` do catálogo são segundos relativos ao início do toque.
                // Mantemos o multiplicador de dificuldade existente e usamos o
                // speedMulti da música para acelerar/desacelerar o toque.
                const difficultySpeed = this.diffSettings[this.selectedDiff].speedMult;
                const speedFactor = song.speedMulti * difficultySpeed;

                // O jogo continua dando tempo para a nota atravessar a tela até o alvo.
                const leadTime = 1400;

                this.songNotesSequence = song.notes.map(note => ({
                    time: leadTime + (note.t * 1000) / speedFactor,
                    lane: note.lane,
                    hit: false
                }));
            }

            pauseGame() {
                if (!this.isPlaying) return;
                this.isPaused = true;
                document.getElementById('pauseMenu').classList.remove('hidden');
            }

            resumeGame() {
                this.isPaused = false;
                document.getElementById('pauseMenu').classList.add('hidden');
                this.lastTime = performance.now();
                requestAnimationFrame((time) => this.gameLoop(time));
            }

            showMenu() {
                this.isPlaying = false;
                this.isPaused = false;
                document.getElementById('mainMenu').classList.remove('hidden');
                document.getElementById('pauseMenu').classList.add('hidden');
                document.getElementById('resultsMenu').classList.add('hidden');
            }

            triggerLane(lane) {
                if (!this.isPlaying || this.isPaused) return;

                this.lanePressState[lane] = true;
                const btn = document.getElementById(`btn-lane-${lane}`);
                if (btn) {
                    btn.classList.add('hit-active');
                    setTimeout(() => btn.classList.remove('hit-active'), 130);
                }

                const targetY = this.canvas.height * 0.82;
                const settings = this.diffSettings[this.selectedDiff];

                let closestNote = null;
                let minDistance = Infinity;

                for (let note of this.notes) {
                    if (note.lane === lane && !note.hit) {
                        const dist = Math.abs(note.y - targetY);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestNote = note;
                        }
                    }
                }

                if (closestNote && minDistance < settings.windowGood) {
                    closestNote.hit = true;
                    this.hitNotes++;

                    let judgment = 'AXÉ!';
                    let color = 'text-emerald-400';
                    let points = 100;

                    if (minDistance <= settings.windowPerfect) {
                        judgment = 'PERFEITO!';
                        color = 'text-yellow-300';
                        points = 250;
                        this.perfectCount++;
                    }

                    const mult = this.getMultiplier();
                    this.score += points * mult;
                    this.streak++;
                    if (this.streak > this.maxStreak) this.maxStreak = this.streak;

                    this.health = Math.min(100, this.health + 3.5);
                    this.synth.playTone(lane);
                    this.showJudgment(judgment, color);
                } else {
                    this.streak = 0;
                    this.health = Math.max(0, this.health - 6);
                    this.synth.playMissSound();
                }

                this.updateHUD();
            }

            getMultiplier() {
                if (this.streak >= 24) return 4;
                if (this.streak >= 16) return 3;
                if (this.streak >= 8) return 2;
                return 1;
            }

            showJudgment(text, textColorClass) {
                const container = document.getElementById('judgmentContainer');
                const el = document.createElement('div');
                el.className = `judgment-popup text-2xl sm:text-4xl ${textColorClass}`;
                el.innerText = text;
                container.appendChild(el);
                setTimeout(() => el.remove(), 500);
            }

            updateHUD() {
                document.getElementById('scoreText').innerText = this.score.toLocaleString();
                document.getElementById('streakText').innerText = this.streak;
                document.getElementById('multiplierText').innerText = `${this.getMultiplier()}x`;

                const healthBar = document.getElementById('healthBar');
                healthBar.style.width = `${this.health}%`;
            }

            gameLoop(timestamp) {
                if (!this.isPlaying || this.isPaused) return;

                const deltaTime = timestamp - this.lastTime;
                this.lastTime = timestamp;

                this.spawnTimer += deltaTime;
                while (this.nextNoteIndex < this.songNotesSequence.length &&
                       this.spawnTimer >= this.songNotesSequence[this.nextNoteIndex].time) {

                    const noteData = this.songNotesSequence[this.nextNoteIndex];
                    this.notes.push({
                        lane: noteData.lane,
                        y: 0,
                        hit: false
                    });
                    this.totalNotes++;
                    this.nextNoteIndex++;
                }

                const speed = this.diffSettings[this.selectedDiff].speed * (this.canvas.height / 580);
                for (let i = this.notes.length - 1; i >= 0; i--) {
                    const note = this.notes[i];
                    note.y += speed * (deltaTime * 0.45);

                    const targetY = this.canvas.height * 0.82;
                    if (!note.hit && note.y > targetY + 55) {
                        this.notes.splice(i, 1);
                        this.streak = 0;
                        this.health = Math.max(0, this.health - 7);
                        this.showJudgment('ERROU', 'text-red-500');
                        this.synth.playMissSound();
                        this.updateHUD();

                        if (this.health <= 0) {
                            this.endGame(false);
                            return;
                        }
                    } else if (note.hit && note.y > targetY + 10) {
                        this.notes.splice(i, 1);
                    }
                }

                this.render();

                if (this.nextNoteIndex >= this.songNotesSequence.length && this.notes.length === 0) {
                    this.endGame(true);
                    return;
                }

                requestAnimationFrame((time) => this.gameLoop(time));
            }

            render() {
                const ctx = this.ctx;
                const width = this.canvas.width;
                const height = this.canvas.height;

                ctx.clearRect(0, 0, width, height);

                const topWidth = width * 0.22;
                const bottomWidth = width * 0.88;
                const topY = height * 0.05;
                const bottomY = height * 0.90;

                const topX = (width - topWidth) / 2;
                const bottomX = (width - bottomWidth) / 2;

                // Highway Track Surface
                ctx.beginPath();
                ctx.moveTo(topX, topY);
                ctx.lineTo(topX + topWidth, topY);
                ctx.lineTo(bottomX + bottomWidth, bottomY);
                ctx.lineTo(bottomX, bottomY);
                ctx.closePath();
                ctx.fillStyle = 'rgba(11, 20, 13, 0.95)';
                ctx.fill();
                ctx.strokeStyle = '#15803d';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Lane Colors: X = Green, CAXIXI = Red, I = Yellow, O = Blue
                const laneColors = ['#22c55e', '#ef4444', '#eab308', '#3b82f6'];

                // Track Dividers
                for (let i = 0; i <= 4; i++) {
                    const ratio = i / 4;
                    const lx1 = topX + topWidth * ratio;
                    const lx2 = bottomX + bottomWidth * ratio;

                    ctx.beginPath();
                    ctx.moveTo(lx1, topY);
                    ctx.lineTo(lx2, bottomY);
                    ctx.strokeStyle = i === 0 || i === 4 ? '#eab308' : 'rgba(34, 197, 94, 0.25)';
                    ctx.lineWidth = i === 0 || i === 4 ? 4 : 2;
                    ctx.stroke();
                }

                // Active Touch/Key Flash Glow
                for (let i = 0; i < 4; i++) {
                    if (this.lanePressState[i]) {
                        const r1 = i / 4;
                        const r2 = (i + 1) / 4;

                        ctx.beginPath();
                        ctx.moveTo(topX + topWidth * r1, topY);
                        ctx.lineTo(topX + topWidth * r2, topY);
                        ctx.lineTo(bottomX + bottomWidth * r2, bottomY);
                        ctx.lineTo(bottomX + bottomWidth * r1, bottomY);
                        ctx.closePath();

                        ctx.fillStyle = laneColors[i] + '35';
                        ctx.fill();
                    }
                }

                // Target Receptor Line
                const targetY = height * 0.82;
                const targetRatio = (targetY - topY) / (bottomY - topY);
                const targetWidth = topWidth + (bottomWidth - topWidth) * targetRatio;
                const targetStartX = topX + (bottomX - topX) * targetRatio;

                ctx.beginPath();
                ctx.moveTo(targetStartX, targetY);
                ctx.lineTo(targetStartX + targetWidth, targetY);
                ctx.strokeStyle = 'rgba(234, 179, 8, 0.9)';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Target Receptors
                for (let i = 0; i < 4; i++) {
                    const centerRatio = (i + 0.5) / 4;
                    const rx = targetStartX + targetWidth * centerRatio;
                    const radius = targetWidth * 0.095;

                    ctx.beginPath();
                    ctx.arc(rx, targetY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = laneColors[i];
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fill();
                }

                // Draw Falling Notes
                for (let note of this.notes) {
                    if (note.hit) continue;

                    const progress = (note.y - topY) / (bottomY - topY);
                    if (progress < 0) continue;

                    const currentTrackWidth = topWidth + (bottomWidth - topWidth) * progress;
                    const currentStartX = topX + (bottomX - topX) * progress;

                    const laneCenterRatio = (note.lane + 0.5) / 4;
                    const noteX = currentStartX + currentTrackWidth * laneCenterRatio;
                    const noteSize = Math.max(9, currentTrackWidth * 0.088);

                    ctx.save();
                    ctx.translate(noteX, note.y);

                    ctx.shadowColor = laneColors[note.lane];
                    ctx.shadowBlur = 10;

                    ctx.beginPath();
                    ctx.ellipse(0, 0, noteSize, noteSize * 0.6, 0, 0, Math.PI * 2);
                    ctx.fillStyle = laneColors[note.lane];
                    ctx.fill();

                    ctx.beginPath();
                    ctx.ellipse(0, 0, noteSize * 0.5, noteSize * 0.3, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();

                    ctx.restore();
                }
            }

            endGame(isWin) {
                this.isPlaying = false;

                const header = document.getElementById('resultStatusHeader');
                if (isWin) {
                    header.innerText = "AXÉ NA RODA!";
                    header.className = "text-3xl font-black mb-1 uppercase tracking-wider text-yellow-400";
                } else {
                    header.innerText = "PERDEU O RITMO";
                    header.className = "text-3xl font-black mb-1 uppercase tracking-wider text-red-500";
                }

                document.getElementById('resultSongTitle').innerText = this.selectedSong.title;
                document.getElementById('resScore').innerText = this.score.toLocaleString();
                document.getElementById('resStreak').innerText = `${this.maxStreak}x`;

                const accuracy = this.totalNotes > 0 ? Math.round((this.hitNotes / this.totalNotes) * 100) : 0;
                document.getElementById('resAccuracy').innerText = `${accuracy}%`;
                document.getElementById('resPerfects').innerText = this.perfectCount;

                document.getElementById('resultsMenu').classList.remove('hidden');
            }
        }

        window.addEventListener('load', () => {
            window.game = new CapoeiraGame();
        });
    </script>
</body>
