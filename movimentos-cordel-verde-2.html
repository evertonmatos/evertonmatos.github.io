<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Movimentos Cordel Verde</title>
  <style>
    :root {
      --bg-color: #12141c;
      --card-bg: #1e222f;
      --primary: #00b894;
      --primary-hover: #55efc4;
      --accent: #70a1ff;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
      user-select: none;
      cursor: pointer;
      background-color: var(--bg-color);
      color: var(--text-main);
      touch-action: pan-x pan-y;
      overflow: hidden;
    }

    /* Botão Fullscreen */
    #btn-fullscreen {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }
    #btn-fullscreen:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }
    #btn-fullscreen svg {
      width: 22px;
      height: 22px;
      fill: var(--text-main);
    }

    #conteudo-principal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      min-height: 0;
    }

    #previo {
      font-size: 3.5rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.2rem;
      margin-bottom: 10px;
      opacity: 0.6;
      transition: font-size 0.05s ease-out;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #resultado {
      font-size: 6.5rem;
      font-weight: 800;
      color: var(--text-main);
      text-align: center;
      padding: 10px;
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 184, 148, 0.25);
      transition: font-size 0.05s ease-out;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #barras-container {
      width: 85%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .bar-wrapper {
      width: 100%;
      height: 14px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    #time-bar {
      width: 100%;
      height: 100%;
      background-color: var(--primary);
      transition: width 0.1s linear, background-color 0.1s linear;
      border-radius: 7px;
    }
    #ciclo-bar {
      width: 100%;
      height: 100%;
      background-color: var(--accent);
      transition: width 0.3s ease;
      border-radius: 7px;
    }

    /* Modal customizado */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 18, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }
    .modal-box {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      max-width: 360px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 {
      margin-top: 0;
      color: var(--text-main);
      font-size: 1.4rem;
      margin-bottom: 15px;
    }
    .modal-box p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 8px;
      text-align: left;
    }
    .modal-box input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      box-sizing: border-box;
      margin-bottom: 15px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-radius: 8px;
    }

    /* Seleção de Categorias Estilizada */
    .categorias-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px;
      margin-bottom: 15px;
      max-height: 160px;
      overflow-y: auto;
      text-align: left;
      padding-right: 4px;
    }
    .categoria-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.15);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .categoria-item input {
      width: auto;
      margin: 0;
      cursor: pointer;
    }
    .categoria-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text-main);
    }

    .modal-botoes-modo {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-box button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #12141c;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .modal-box button:active {
      transform: scale(0.98);
    }
    .modal-box button.btn-secundario {
      background-color: var(--accent);
    }
    .modal-box button.btn-terciario {
      background-color: #f39c12;
    }

    /* Botao de fim de ciclo */
    #acoes-ciclo {
      display: none;
      margin-top: 20px;
    }
    .btn-acao {
      padding: 16px 48px;
      font-size: 2rem;
      font-weight: bold;
      color: #12141c;
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
    }
    .btn-acao:active {
      transform: scale(0.98);
    }

    /* Ajustes específicos para Modo Paisagem / Telas Baixas */
    @media (max-height: 500px) {
      body {
        padding: 5px;
      }
      #previo {
        font-size: 2.2rem;
        margin-bottom: 2px;
      }
      #resultado {
        font-size: 4rem;
        padding: 2px;
      }
      #barras-container {
        gap: 6px;
        margin-bottom: 5px;
      }
      .bar-wrapper {
        height: 10px;
      }
      #btn-fullscreen {
        top: 8px;
        right: 8px;
        width: 36px;
        height: 36px;
      }
      #btn-fullscreen svg {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Botão de Fullscreen -->
  <button id="btn-fullscreen" title="Alternar Tela Cheia">
    <svg viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>

  <!-- Modal de Configuração -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3>Configuração do Treino</h3>
      <p>Intervalo em segundos:</p>
      <input type="number" id="input-intervalo" value="10" min="1">

      <p>Filtrar por Categorias:</p>
      <div class="categorias-grid" id="categorias-container">
        <!-- Preenchido via JavaScript -->
      </div>

      <div class="modal-botoes-modo">
        <button id="btn-modo-treino">MODO TREINO (Sequência)</button>
        <button id="btn-modo-aleatorio" class="btn-secundario">MODO ALEATÓRIO (Infinito)</button>
        <button id="btn-modo-categoria" class="btn-terciario">TREINAR CATEGORIAS SELECIONADAS</button>
      </div>
    </div>
  </div>

  <div id="conteudo-principal">
    <div id="previo"></div>
    <div id="resultado">CLIQUE PARA INICIAR</div>

    <div id="acoes-ciclo">
      <button id="btn-mais-um" class="btn-acao">+1</button>
    </div>
  </div>

  <div id="barras-container" style="visibility: hidden;">
    <div class="bar-wrapper">
      <div id="time-bar"></div>
    </div>
    <div class="bar-wrapper" id="ciclo-bar-wrapper">
      <div id="ciclo-bar"></div>
    </div>
  </div>

  <script>
    // Dicionário de Categorias estruturado com base na apostila
    const categoriasBase = {
      "Esquivas": ["COCORINHA", "NEGATIVA", "NEGATIVA DE FUGA", "ARRASTÃO", "PAULISTINHA", "ESQUIVA FRONTAL", "ESQUIVA LATERAL"],
      "Movimentos Frontais": ["PONTEIRA", "BENÇÃO", "MEIA LUA DE DENTRO", "MEIA LUA DE FORA"],
      "Movimentos Laterais": ["MARTELO", "MARTELO CRUZADO", "ESPORÃO", "QUEIXADA", "VINGATIVA"],
      "Movimentos de Giro": ["RABO DE ARRAIA", "MEIA LUA DE COMPASSO", "MEIA LUA DE ARMADA", "ESPORÃO DE COSTAS", "MARTELO DE GIRO"],
      "Acrobacias": ["AU ABERTO", "AU FECHADO", "AU COM UMA MÃO", "AU CANIVETE", "CHAPÉU DE COURO", "QUEDA DE RINS"]
    };

    // Gera a lista completa de palavras originais combinando todas as categorias
    const palavrasOriginais = Object.values(categoriasBase).flat();

    let palavrasDisponiveis = [...palavrasOriginais];
    let intervaloSegundos = 10;
    let tempoRestante = 10;
    let temporizador = null;
    let timerVoz = null;
    let timerInicio = null;
    let timerLongPress = null;
    let foiLongPress = false;
    let ultimoSegundoBipado = -1;
    let palavraAtual = "";

    // Modos: "TREINO", "ALEATORIO", "CATEGORIA"
    let modoExecucao = "TREINO";
    let audioCtx = null;

    // Renderiza as opções de categorias no modal de configuração
    function renderizarCategoriasModal() {
      const container = document.getElementById("categorias-container");
      container.innerHTML = "";
      Object.keys(categoriasBase).forEach((cat, index) => {
        const label = document.createElement("label");
        label.className = "categoria-item";
        label.innerHTML = `
          <input type="checkbox" name="cat-filtro" value="${cat}" checked>
          <span>${cat}</span>
        `;
        container.appendChild(label);
      });
    }
    renderizarCategoriasModal();

    function obterContextoAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function pararLimparTudo() {
      if (temporizador !== null) { clearInterval(temporizador); temporizador = null; }
      if (timerVoz !== null) { clearTimeout(timerVoz); timerVoz = null; }
      if (timerInicio !== null) { clearTimeout(timerInicio); timerInicio = null; }
      if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
      if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
    }

    function tocarBipe(freq) {
      obterContextoAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function tocarSineta() {
      obterContextoAudio();
      if (!audioCtx) return;
      const toques = [0, 0.12, 0.24];
      toques.forEach((delay) => {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1200, audioCtx.currentTime + delay);
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(2400, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.18);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(audioCtx.currentTime + delay);
        osc2.start(audioCtx.currentTime + delay);
        osc1.stop(audioCtx.currentTime + delay + 0.18);
        osc2.stop(audioCtx.currentTime + delay + 0.18);
      });
    }

    function tocarSomFimCiclo() {
      obterContextoAudio();
      if (!audioCtx) return;
      const toques = [0, 0.18, 0.36];
      toques.forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.15);
      });
    }

    function iniciarContador() {
      pararLimparTudo();
      tempoRestante = intervaloSegundos;
      ultimoSegundoBipado = -1;
      atualizarBarras();
      temporizador = setInterval(tick, 100);
    }

    function lerTexto(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let textoParaVoz = texto
          .replace(/\bAU COM UMA MÃO\b/g, "AÚ COM MAMÃO")
          .replace(/\bMEIA\b/g, "MÊIA")
          .replace(/\bAU FECHADO\b/g, "AÚ FECHADO")
          .replace(/\bAU CANIVETE\b/g, "AÚ CANIVETE")
          .replace(/\bAU\b/g, "AÚ");

        const mensagem = new SpeechSynthesisUtterance(textoParaVoz);
        mensagem.lang = 'pt-BR';
        mensagem.rate = 1.0;
        mensagem.onend = () => { iniciarContador(); };
        mensagem.onerror = () => { iniciarContador(); };
        window.speechSynthesis.speak(mensagem);
      } else {
        iniciarContador();
      }
    }

    function atualizarBarras() {
      const proporcaoTempo = Math.max(tempoRestante / intervaloSegundos, 0);
      const porcentagemTempo = proporcaoTempo * 100;
      const hue = proporcaoTempo * 120;

      const timeBar = document.getElementById("time-bar");
      timeBar.style.width = porcentagemTempo + "%";
      timeBar.style.backgroundColor = `hsl(${hue}, 80%, 50%)`;

      if (modoExecucao === "TREINO" || modoExecucao === "CATEGORIA") {
        const totalPalavras = palavrasOriginais.length + 1;
        const restantes = palavrasDisponiveis.length + 1;
        const porcentagemCiclo = (restantes / totalPalavras) * 100;
        document.getElementById("ciclo-bar").style.width = porcentagemCiclo + "%";
      }
    }

    function exibirBotoesFimCiclo() {
      pararLimparTudo();
      document.getElementById("previo").innerText = "";
      document.getElementById("resultado").innerText = "CICLO CONCLUÍDO";
      document.getElementById("barras-container").style.visibility = "hidden";
      document.getElementById("acoes-ciclo").style.display = "block";
    }

    function sortear() {
      pararLimparTudo();
      let sorteada = "";

      if (modoExecucao === "TREINO" || modoExecucao === "CATEGORIA") {
        if (palavrasDisponiveis.length === 0) {
          tocarSomFimCiclo();
          exibirBotoesFimCiclo();
          return;
        } else {
          tocarSineta();
        }
        const indiceSorteado = Math.floor(Math.random() * palavrasDisponiveis.length);
        sorteada = palavrasDisponiveis.splice(indiceSorteado, 1)[0];
      } else {
        tocarSineta();
        let opcoesDisponiveis = palavrasOriginais.filter(p => p !== palavraAtual);
        const indiceSorteado = Math.floor(Math.random() * opcoesDisponiveis.length);
        sorteada = opcoesDisponiveis[indiceSorteado];
      }

      document.getElementById("barras-container").style.visibility = "visible";
      document.getElementById("acoes-ciclo").style.display = "none";

      if (palavraAtual !== "") {
        document.getElementById("previo").innerText = palavraAtual;
      }

      palavraAtual = sorteada;
      document.getElementById("resultado").innerText = sorteada;

      tempoRestante = intervaloSegundos;
      atualizarBarras();

      timerVoz = setTimeout(() => {
        lerTexto(sorteada);
      }, 300);
    }

    function tick() {
      tempoRestante -= 0.1;
      if (tempoRestante <= 0) {
        sortear();
      } else {
        const segundoAtual = Math.ceil(tempoRestante);
        if (segundoAtual !== ultimoSegundoBipado && segundoAtual < intervaloSegundos) {
          ultimoSegundoBipado = segundoAtual;
          const passosTotais = Math.max(intervaloSegundos - 1, 1);
          const passoAtual = intervaloSegundos - segundoAtual;
          const progresso = Math.min(passoAtual / passosTotais, 1.0);
          const frequencia = 220 + (progresso * 660);
          tocarBipe(frequencia);
        }
        atualizarBarras();
      }
    }

    // Tela Cheia
    document.getElementById("btn-fullscreen").addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    document.getElementById("btn-mais-um").addEventListener("click", (e) => {
      e.stopPropagation();
      pararLimparTudo();
      palavrasDisponiveis = [...palavrasOriginais];
      document.getElementById("acoes-ciclo").style.display = "none";
      document.getElementById("resultado").innerText = "INICIANDO";
      document.getElementById("previo").innerText = "";
      timerInicio = setTimeout(() => { sortear(); }, 2000);
    });

    // Configuração de Modos no Modal
    function configurarEIniciar(modo) {
      pararLimparTudo();
      modoExecucao = modo;
      const val = parseInt(document.getElementById("input-intervalo").value, 10);
      intervaloSegundos = (!isNaN(val) && val > 0) ? val : 10;

      if (modo === "CATEGORIA") {
        const checkboxes = document.querySelectorAll('input[name="cat-filtro"]:checked');
        let selecionadas = [];
        checkboxes.forEach(cb => {
          if (categoriasBase[cb.value]) {
            selecionadas.push(...categoriasBase[cb.value]);
          }
        });
        if (selecionadas.length === 0) {
          alert("Selecione pelo menos uma categoria!");
          return;
        }
        palavrasDisponiveis = [...selecionadas];
        document.getElementById("ciclo-bar-wrapper").style.display = "block";
      } else if (modo === "TREINO") {
        palavrasDisponiveis = [...palavrasOriginais];
        document.getElementById("ciclo-bar-wrapper").style.display = "block";
      } else {
        document.getElementById("ciclo-bar-wrapper").style.display = "none";
      }

      palavraAtual = "";
      document.getElementById("modal-overlay").style.display = "none";
      obterContextoAudio();

      document.getElementById("resultado").innerText = "INICIANDO";
      document.getElementById("previo").innerText = "";

      timerInicio = setTimeout(() => { sortear(); }, 2000);
    }

    document.getElementById("btn-modo-treino").addEventListener("click", (e) => { e.stopPropagation(); configurarEIniciar("TREINO"); });
    document.getElementById("btn-modo-aleatorio").addEventListener("click", (e) => { e.stopPropagation(); configurarEIniciar("ALEATORIO"); });
    document.getElementById("btn-modo-categoria").addEventListener("click", (e) => { e.stopPropagation(); configurarEIniciar("CATEGORIA"); });

    // Gestos de toque longo (voltar ao menu) e Pinça (zoom)
    let distanciaInicialPinça = 0;
    let tamanhoResultadoInicial = 0;
    let tamanhoPrevioInicial = 0;
    let foiGestoPinca = false;

    function obterDistanciaToques(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    document.body.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        foiLongPress = false;
        if (timerLongPress !== null) clearTimeout(timerLongPress);
        timerLongPress = setTimeout(() => {
          foiLongPress = true;
          pararLimparTudo();
          palavraAtual = "";
          document.getElementById("previo").innerText = "";
          document.getElementById("resultado").innerText = "CLIQUE PARA INICIAR";
          document.getElementById("barras-container").style.visibility = "hidden";
          document.getElementById("acoes-ciclo").style.display = "none";
          document.getElementById("modal-overlay").style.display = "flex";
        }, 3000);
      } else if (e.touches.length === 2) {
        if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
        foiGestoPinca = true;
        distanciaInicialPinça = obterDistanciaToques(e.touches);
        tamanhoResultadoInicial = parseFloat(window.getComputedStyle(document.getElementById("resultado")).fontSize);
        tamanhoPrevioInicial = parseFloat(window.getComputedStyle(document.getElementById("previo")).fontSize);
      }
    }, { passive: false });

    document.body.addEventListener("touchmove", (e) => {
      if (e.touches.length > 1 && timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
      if (e.touches.length === 2 && distanciaInicialPinça > 0) {
        e.preventDefault();
        const fatorEscala = obterDistanciaToques(e.touches) / distanciaInicialPinça;
        document.getElementById("resultado").style.fontSize = `${Math.min(Math.max(tamanhoResultadoInicial * fatorEscala, 24), 192)}px`;
        document.getElementById("previo").style.fontSize = `${Math.min(Math.max(tamanhoPrevioInicial * fatorEscala, 12), 96)}px`;
      }
    }, { passive: false });

    document.body.addEventListener("touchend", (e) => {
      if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
      if (e.touches.length < 2) {
        distanciaInicialPinça = 0;
        if (foiGestoPinca) setTimeout(() => { foiGestoPinca = false; }, 300);
      }
    });

    document.body.addEventListener("touchcancel", () => {
      if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
    });

    document.body.addEventListener("click", () => {
      if (foiGestoPinca || foiLongPress) return;
      if (document.getElementById("modal-overlay").style.display !== "none") return;
      if (document.getElementById("acoes-ciclo").style.display === "block") return;
      pararLimparTudo();
      obterContextoAudio();
      sortear();
    });
  </script>
</body>
</html>
