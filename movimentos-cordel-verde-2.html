<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Movimentos Cordel Verde</title>
  <style>
    :root {
      --bg-color: #12141c;
      --card-bg: #1e222f;
      --primary: #00b894;
      --primary-hover: #55efc4;
      --accent: #70a1ff;
      --text-main: #f1f2f6;
      --text-muted: #a4b0be;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      user-select: none;
      cursor: pointer;
      background-color: var(--bg-color);
      color: var(--text-main);
      touch-action: pan-x pan-y;
      overflow: hidden;
    }

    /* Controles Fixos no Topo Direito */
    .botoes-topo {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 999;
      display: flex;
      gap: 8px;
    }

    .btn-topo {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.2s ease;
    }
    .btn-topo:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }
    .btn-topo svg {
      width: 20px;
      height: 20px;
      fill: var(--text-main);
    }

    #conteudo-principal {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      width: 100%;
      min-height: 0;
    }

    #previo {
      font-size: 2.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      min-height: 1rem;
      margin-bottom: 5px;
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #resultado {
      font-size: 5.5rem;
      font-weight: 800;
      color: var(--text-main);
      text-align: center;
      padding: 5px;
      line-height: 1.1;
      text-shadow: 0 4px 20px rgba(0, 184, 148, 0.25);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Exibição da Categoria na Tela Principal */
    #categoria-atual-display {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 10px;
      min-height: 1.5rem;
      text-shadow: 0 2px 10px rgba(112, 161, 255, 0.3);
    }

    #barras-container {
      width: 85%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }
    .bar-wrapper {
      width: 100%;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }
    #time-bar {
      width: 100%;
      height: 100%;
      background-color: var(--primary);
      transition: width 0.1s linear, background-color 0.1s linear;
      border-radius: 6px;
    }
    #ciclo-bar {
      width: 100%;
      height: 100%;
      background-color: var(--accent);
      transition: width 0.3s ease;
      border-radius: 6px;
    }

    /* Modal customizado */
    #modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 18, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px;
      box-sizing: border-box;
    }
    .modal-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-sizing: border-box;
    }
    .modal-box h3 {
      margin-top: 0;
      color: var(--text-main);
      font-size: 1.25rem;
      margin-bottom: 12px;
    }
    .modal-box p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 6px;
      text-align: left;
    }
    .modal-box input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-radius: 8px;
    }

    /* Botões de Categoria Estilizados */
    .categorias-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
      text-align: left;
    }
    .btn-categoria {
      width: 100%;
      padding: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-categoria:hover {
      background: rgba(255,255,255,0.1);
      border-color: var(--accent);
    }

    .modal-botoes-modo {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-box button {
      width: 100%;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #12141c;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }
    .modal-box button:active {
      transform: scale(0.98);
    }
    .modal-box button.btn-secundario {
      background-color: var(--accent);
    }
    .modal-box button.btn-terciario {
      background-color: #f39c12;
    }

    /* Botao de fim de ciclo */
    #acoes-ciclo {
      display: none;
      margin-top: 15px;
    }
    .btn-acao {
      padding: 14px 40px;
      font-size: 1.8rem;
      font-weight: bold;
      color: #12141c;
      background-color: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
    }
    .btn-acao:active {
      transform: scale(0.98);
    }

    /* Ajustes para Modo Paisagem / Telas Baixas */
    @media (max-height: 500px) {
      body {
        padding: 4px;
      }
      #previo {
        font-size: 2rem;
        margin-bottom: 2px;
      }
      #resultado {
        font-size: 3.5rem;
        padding: 2px;
      }
      #categoria-atual-display {
        font-size: 1.1rem;
        margin-top: 4px;
      }
      #barras-container {
        gap: 4px;
        margin-bottom: 2px;
      }
      .bar-wrapper {
        height: 10px;
      }
      .modal-box {
        padding: 12px;
        max-width: 320px;
      }
      .modal-box h3 {
        font-size: 1.1rem;
        margin-bottom: 8px;
      }
      .modal-box input[type="number"] {
        padding: 6px;
        margin-bottom: 8px;
      }
      .modal-box button {
        padding: 8px;
        font-size: 0.85rem;
      }
      .btn-categoria {
        padding: 6px;
        font-size: 0.75rem;
      }
      .btn-topo {
        width: 34px;
        height: 34px;
      }
      .btn-topo svg {
        width: 16px;
        height: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Controles Fixos no Topo Direito -->
  <div class="botoes-topo">
    <!-- Botão Home -->
    <button id="btn-home" class="btn-topo" title="Ir para Página Inicial">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </button>
    <!-- Botão Rotação -->
    <button id="btn-rotate" class="btn-topo" title="Bloquear/Desbloquear Rotação">
      <svg viewBox="0 0 24 24">
        <path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h-2.02c-.34-3.04-2.52-5.52-5.46-6.42v-2.06m-8.96 17.96c-3.27-1.55-5.61-4.72-5.97-8.48h2.02c.34 3.04 2.52 5.52 5.46 6.42v2.06M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2m0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
    </button>
    <!-- Botão Fullscreen -->
    <button id="btn-fullscreen" class="btn-topo" title="Alternar Tela Cheia">
      <svg viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
  </div>

  <!-- Modal de Configuração -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h3>Configuração do Treino</h3>
      <p>Intervalo em segundos:</p>
      <input type="number" id="input-intervalo" value="10" min="1">

      <!-- Visão Inicial do Menu com apenas 3 botões -->
      <div id="menu-principal-botoes" class="modal-botoes-modo">
        <button id="btn-modo-treino">SIMULADO CORDEL VERDE</button>
        <button id="btn-modo-aleatorio" class="btn-secundario">MODO ALEATÓRIO (Infinito)</button>
        <button id="btn-menu-categorias" class="btn-terciario">CATEGORIAS</button>
      </div>

      <!-- Visão Secundária para Seleção de Categorias como Botões -->
      <div id="menu-categorias-secao" style="display: none;">
        <p>Escolha a Categoria (Modo Finito / Ciclo):</p>
        <div class="categorias-grid" id="categorias-finitas-container">
          <!-- Preenchido via JavaScript -->
        </div>
        <p>Ou Modo Infinito por Categoria:</p>
        <div class="categorias-grid" id="categorias-infinitas-container">
          <!-- Preenchido via JavaScript -->
        </div>
        <div class="modal-botoes-modo" style="margin-top: 8px;">
          <button id="btn-voltar-menu" class="btn-secundario">VOLTAR</button>
        </div>
      </div>
    </div>
  </div>

  <div id="conteudo-principal">
    <div id="previo"></div>
    <div id="resultado">CLIQUE PARA INICIAR</div>
    <div id="categoria-atual-display"></div>

    <div id="acoes-ciclo">
      <button id="btn-mais-um" class="btn-acao">+1</button>
    </div>
  </div>

  <div id="barras-container" style="visibility: hidden;">
    <div class="bar-wrapper">
      <div id="time-bar"></div>
    </div>
    <div class="bar-wrapper" id="ciclo-bar-wrapper">
      <div id="ciclo-bar"></div>
    </div>
  </div>

  <script>
    // Dicionário de Categorias estruturado com base na apostila
    const categoriasBase = {
      "Esquivas": ["COCORINHA", "NEGATIVA", "NEGATIVA DE FUGA", "ARRASTÃO", "PAULISTINHA", "ESQUIVA FRONTAL", "ESQUIVA LATERAL"],
      "Movimentos Frontais": ["PONTEIRA", "BENÇÃO", "MEIA LUA DE DENTRO", "MEIA LUA DE FORA"],
      "Movimentos Laterais": ["MARTELO", "MARTELO CRUZADO", "ESPORÃO", "QUEIXADA", "VINGATIVA"],
      "Movimentos de Giro": ["RABO DE ARRAIA", "MEIA LUA DE COMPASSO", "MEIA LUA DE ARMADA", "ESPORÃO DE COSTAS", "MARTELO DE GIRO"],
      "Acrobacias": ["AU ABERTO", "AU FECHADO", "AU COM UMA MÃO", "AU CANIVETE", "CHAPÉU DE COURO", "QUEDA DE RINS"]
    };

    // Mapeia cada movimento para a sua categoria correspondente
    const mapaMovimentoCategoria = {};
    Object.keys(categoriasBase).forEach(cat => {
      categoriasBase[cat].forEach(mov => {
        mapaMovimentoCategoria[mov] = cat;
      });
    });

    const palavrasOriginais = Object.values(categoriasBase).flat();

    let palavrasDisponiveis = [...palavrasOriginais];
    let intervaloSegundos = 10;
    let tempoRestante = 10;
    let temporizador = null;
    let timerVoz = null;
    let timerInicio = null;
    let timerLongPress = null;
    let foiLongPress = false;
    let ultimoSegundoBipado = -1;
    let palavraAtual = "";

    // Modos: "TREINO", "ALEATORIO", "CATEGORIA_FINITA", "CATEGORIA_INFINITA"
    let modoExecucao = "TREINO";
    let categoriaSelecionada = [];
    let audioCtx = null;

    // Renderiza os botões de categorias no modal de configuração
    function renderizarCategoriasModal() {
      const containerFinito = document.getElementById("categorias-finitas-container");
      const containerInfinito = document.getElementById("categorias-infinitas-container");

      containerFinito.innerHTML = "";
      containerInfinito.innerHTML = "";

      Object.keys(categoriasBase).forEach((cat) => {
        // Botão para Modo Finito/Ciclo da Categoria
        const btnFinito = document.createElement("button");
        btnFinito.className = "btn-categoria";
        btnFinito.innerText = cat;
        btnFinito.addEventListener("click", (e) => {
          e.stopPropagation();
          iniciarModoCategoria(cat, false);
        });
        containerFinito.appendChild(btnFinito);

        // Botão para Modo Infinito da Categoria
        const btnInfinito = document.createElement("button");
        btnInfinito.className = "btn-categoria btn-secundario";
        btnInfinito.style.backgroundColor = "rgba(112, 161, 255, 0.2)";
        btnInfinito.style.borderColor = "var(--accent)";
        btnInfinito.innerText = `${cat} (Infinito)`;
        btnInfinito.addEventListener("click", (e) => {
          e.stopPropagation();
          iniciarModoCategoria(cat, true);
        });
        containerInfinito.appendChild(btnInfinito);
      });
    }
    renderizarCategoriasModal();

    function obterContextoAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function pararLimparTudo() {
      if (temporizador !== null) { clearInterval(temporizador); temporizador = null; }
      if (timerVoz !== null) { clearTimeout(timerVoz); timerVoz = null; }
      if (timerInicio !== null) { clearTimeout(timerInicio); timerInicio = null; }
      if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
      if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
      if (audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend();
      }
    }

    function tocarBipe(freq) {
      obterContextoAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function tocarSineta() {
      obterContextoAudio();
      if (!audioCtx) return;
      const toques = [0, 0.12, 0.24];
      toques.forEach((delay) => {
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(1200, audioCtx.currentTime + delay);
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(2400, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.18);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(audioCtx.currentTime + delay);
        osc2.start(audioCtx.currentTime + delay);
        osc1.stop(audioCtx.currentTime + delay + 0.18);
        osc2.stop(audioCtx.currentTime + delay + 0.18);
      });
    }

    function tocarSomFimCiclo() {
      obterContextoAudio();
      if (!audioCtx) return;
      const toques = [0, 0.18, 0.36];
      toques.forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1800, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.15);
      });
    }

    function iniciarContador() {
      pararLimparTudo();
      tempoRestante = intervaloSegundos;
      ultimoSegundoBipado = -1;
      atualizarBarras();
      temporizador = setInterval(tick, 100);
    }

    function lerTexto(texto) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let textoParaVoz = texto
          .replace(/\bAU COM UMA MÃO\b/g, "AÚ COM MAMÃO")
          .replace(/\bMEIA\b/g, "MÊIA")
          .replace(/\bAU FECHADO\b/g, "AÚ FECHADO")
          .replace(/\bAU CANIVETE\b/g, "AÚ CANIVETE")
          .replace(/\bAU\b/g, "AÚ");

        const mensagem = new SpeechSynthesisUtterance(textoParaVoz);
        mensagem.lang = 'pt-BR';
        mensagem.rate = 1.0;
        mensagem.onend = () => { iniciarContador(); };
        mensagem.onerror = () => { iniciarContador(); };
        window.speechSynthesis.speak(mensagem);
      } else {
        iniciarContador();
      }
    }

    function atualizarBarras() {
      const proporcaoTempo = Math.max(tempoRestante / intervaloSegundos, 0);
      const porcentagemTempo = proporcaoTempo * 100;
      const hue = proporcaoTempo * 120;

      const timeBar = document.getElementById("time-bar");
      timeBar.style.width = porcentagemTempo + "%";
      timeBar.style.backgroundColor = `hsl(${hue}, 80%, 50%)`;

      if (modoExecucao === "TREINO" || modoExecucao === "CATEGORIA_FINITA") {
        const baseTotal = (modoExecucao === "TREINO") ? palavrasOriginais : categoriaSelecionada;
        const totalPalavras = baseTotal.length + 1;
        const restantes = palavrasDisponiveis.length + 1;
        const porcentagemCiclo = (restantes / totalPalavras) * 100;
        document.getElementById("ciclo-bar").style.width = porcentagemCiclo + "%";
      }
    }

    function voltarTelaInicial() {
      pararLimparTudo();
      palavraAtual = "";
      palavrasDisponiveis = [...palavrasOriginais];

      document.getElementById("previo").innerText = "";
      document.getElementById("resultado").innerText = "CLIQUE PARA INICIAR";
      document.getElementById("categoria-atual-display").innerText = "";
      document.getElementById("barras-container").style.visibility = "hidden";
      document.getElementById("acoes-ciclo").style.display = "none";

      // Reseta visualização do modal para o menu principal
      document.getElementById("menu-principal-botoes").style.display = "flex";
      document.getElementById("menu-categorias-secao").style.display = "none";
      document.getElementById("modal-overlay").style.display = "flex";
    }

    function sortear() {
      pararLimparTudo();
      let sorteada = "";

      if (modoExecucao === "TREINO" || modoExecucao === "CATEGORIA_FINITA") {
        if (palavrasDisponiveis.length === 0) {
          tocarSomFimCiclo();
          voltarTelaInicial();
          return;
        } else {
          tocarSineta();
        }
        const indiceSorteado = Math.floor(Math.random() * palavrasDisponiveis.length);
        sorteada = palavrasDisponiveis.splice(indiceSorteado, 1)[0];
      } else if (modoExecucao === "CATEGORIA_INFINITA") {
        tocarSineta();
        let opcoesDisponiveis = categoriaSelecionada.filter(p => p !== palavraAtual);
        const indiceSorteado = Math.floor(Math.random() * opcoesDisponiveis.length);
        sorteada = opcoesDisponiveis[indiceSorteado];
      } else {
        tocarSineta();
        let opcoesDisponiveis = palavrasOriginais.filter(p => p !== palavraAtual);
        const indiceSorteado = Math.floor(Math.random() * opcoesDisponiveis.length);
        sorteada = opcoesDisponiveis[indiceSorteado];
      }

      document.getElementById("barras-container").style.visibility = "visible";
      document.getElementById("acoes-ciclo").style.display = "none";

      if (palavraAtual !== "") {
        document.getElementById("previo").innerText = palavraAtual;
      }

      palavraAtual = sorteada;
      document.getElementById("resultado").innerText = sorteada;
      document.getElementById("categoria-atual-display").innerText = mapaMovimentoCategoria[sorteada] || "";

      tempoRestante = intervaloSegundos;
      atualizarBarras();

      timerVoz = setTimeout(() => {
        lerTexto(sorteada);
      }, 300);
    }

    function tick() {
      tempoRestante -= 0.1;
      if (tempoRestante <= 0) {
        sortear();
      } else {
        const segundoAtual = Math.ceil(tempoRestante);
        if (segundoAtual !== ultimoSegundoBipado && segundoAtual < intervaloSegundos) {
          ultimoSegundoBipado = segundoAtual;
          const passosTotais = Math.max(intervaloSegundos - 1, 1);
          const passoAtual = intervaloSegundos - segundoAtual;
          const progresso = Math.min(passoAtual / passosTotais, 1.0);
          const frequencia = 220 + (progresso * 660);
          tocarBipe(frequencia);
        }
        atualizarBarras();
      }
    }

    // Pausa qualquer som e timer ao minimizar, trocar de aba ou sair da página
    window.addEventListener("blur", () => {
      pararLimparTudo();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        pararLimparTudo();
      }
    });

    // Botão Home fixo
    document.getElementById("btn-home").addEventListener("click", (e) => {
      e.stopPropagation();
      voltarTelaInicial();
    });

    // Botão de Rotação (Screen Orientation API)
    document.getElementById("btn-rotate").addEventListener("click", async (e) => {
      e.stopPropagation();
      try {
        if (screen.orientation && screen.orientation.lock) {
          if (document.documentElement.classList.contains('rotated-landscape')) {
            document.documentElement.classList.remove('rotated-landscape');
            await screen.orientation.unlock();
          } else {
            document.documentElement.classList.add('rotated-landscape');
            const target = (screen.orientation.type.includes('portrait')) ? 'landscape' : 'portrait';
            await screen.orientation.lock(target);
          }
        } else {
          alert("A API de rotação de tela não é suportada diretamente neste navegador.");
        }
      } catch (err) {
        console.log("Erro ao rotacionar tela:", err);
      }
    });

    // Tela Cheia
    document.getElementById("btn-fullscreen").addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    document.getElementById("btn-mais-um").addEventListener("click", (e) => {
      e.stopPropagation();
      pararLimparTudo();
      if (modoExecucao === "CATEGORIA_FINITA") {
        palavrasDisponiveis = [...categoriaSelecionada];
      } else {
        palavrasDisponiveis = [...palavrasOriginais];
      }
      document.getElementById("acoes-ciclo").style.display = "none";
      document.getElementById("resultado").innerText = "INICIANDO";
      document.getElementById("previo").innerText = "";
      document.getElementById("categoria-atual-display").innerText = "";
      timerInicio = setTimeout(() => { sortear(); }, 2000);
    });

    // Navegação do Modal de Categorias
    document.getElementById("btn-menu-categorias").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("menu-principal-botoes").style.display = "none";
      document.getElementById("menu-categorias-secao").style.display = "block";
    });

    document.getElementById("btn-voltar-menu").addEventListener("click", (e) => {
      e.stopPropagation();
      document.getElementById("menu-categorias-secao").style.display = "none";
      document.getElementById("menu-principal-botoes").style.display = "flex";
    });

    // Configuração de Modos no Modal
    function configurarEIniciar(modo) {
      pararLimparTudo();
      modoExecucao = modo;
      const val = parseInt(document.getElementById("input-intervalo").value, 10);
      intervaloSegundos = (!isNaN(val) && val > 0) ? val : 10;

      if (modo === "TREINO") {
        palavrasDisponiveis = [...palavrasOriginais];
        document.getElementById("ciclo-bar-wrapper").style.display = "block";
      } else {
        document.getElementById("ciclo-bar-wrapper").style.display = "none";
      }

      palavraAtual = "";
      document.getElementById("modal-overlay").style.display = "none";
      obterContextoAudio();

      document.getElementById("resultado").innerText = "INICIANDO";
      document.getElementById("previo").innerText = "";
      document.getElementById("categoria-atual-display").innerText = "";

      timerInicio = setTimeout(() => { sortear(); }, 2000);
    }

    function iniciarModoCategoria(nomeCategoria, infinito) {
      pararLimparTudo();
      const val = parseInt(document.getElementById("input-intervalo").value, 10);
      intervaloSegundos = (!isNaN(val) && val > 0) ? val : 10;

      categoriaSelecionada = categoriasBase[nomeCategoria] || [];
      if (categoriaSelecionada.length === 0) return;

      if (infinito) {
        modoExecucao = "CATEGORIA_INFINITA";
        document.getElementById("ciclo-bar-wrapper").style.display = "none";
      } else {
        modoExecucao = "CATEGORIA_FINITA";
        palavrasDisponiveis = [...categoriaSelecionada];
        document.getElementById("ciclo-bar-wrapper").style.display = "block";
      }

      palavraAtual = "";
      document.getElementById("modal-overlay").style.display = "none";
      obterContextoAudio();

      document.getElementById("resultado").innerText = "INICIANDO";
      document.getElementById("previo").innerText = "";
      document.getElementById("categoria-atual-display").innerText = "";

      timerInicio = setTimeout(() => { sortear(); }, 2000);
    }

    document.getElementById("btn-modo-treino").addEventListener("click", (e) => { e.stopPropagation(); configurarEIniciar("TREINO"); });
    document.getElementById("btn-modo-aleatorio").addEventListener("click", (e) => { e.stopPropagation(); configurarEIniciar("ALEATORIO"); });

    // Gestos de toque longo (voltar ao menu) e Pinça (zoom)
    let distanciaInicialPinça = 0;
    let tamanhoResultadoInicial = 0;
    let tamanhoPrevioInicial = 0;
    let foiGestoPinca = false;

    function obterDistanciaToques(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    document.body.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        foiLongPress = false;
        if (timerLongPress !== null) clearTimeout(timerLongPress);
        timerLongPress = setTimeout(() => {
          foiLongPress = true;
          voltarTelaInicial();
        }, 3000);
      } else if (e.touches.length === 2) {
        if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
        foiGestoPinca = true;
        distanciaInicialPinça = obterDistanciaToques(e.touches);
        tamanhoResultadoInicial = parseFloat(window.getComputedStyle(document.getElementById("resultado")).fontSize);
        tamanhoPrevioInicial = parseFloat(window.getComputedStyle(document.getElementById("previo")).fontSize);
      }
    }, { passive: false });

    document.body.addEventListener("touchmove", (e) => {
      if (e.touches.length > 1 && timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
      if (e.touches.length === 2 && distanciaInicialPinça > 0) {
        e.preventDefault();
        const fatorEscala = obterDistanciaToques(e.touches) / distanciaInicialPinça;
        document.getElementById("resultado").style.fontSize = `${Math.min(Math.max(tamanhoResultadoInicial * fatorEscala, 24), 192)}px`;
        document.getElementById("previo").style.fontSize = `${Math.min(Math.max(tamanhoPrevioInicial * fatorEscala, 12), 96)}px`;
      }
    }, { passive: false });

    document.body.addEventListener("touchend", (e) => {
      if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
      if (e.touches.length < 2) {
        distanciaInicialPinça = 0;
        if (foiGestoPinca) setTimeout(() => { foiGestoPinca = false; }, 300);
      }
    });

    document.body.addEventListener("touchcancel", () => {
      if (timerLongPress !== null) { clearTimeout(timerLongPress); timerLongPress = null; }
    });

    document.body.addEventListener("click", () => {
      if (foiGestoPinca || foiLongPress) return;
      if (document.getElementById("modal-overlay").style.display !== "none") return;
      if (document.getElementById("acoes-ciclo").style.display === "block") return;
      pararLimparTudo();
      obterContextoAudio();
      sortear();
    });
  </script>
</body>
</html>
